<h1>Insertar Libro</h1>
<form >
  <label for="titulo">Título:</label>
  <input type="text" id="titulo" name="titulo" [(ngModel)]="titulo">

  <label for="autor">Autor:</label>
  <input type="text" id="autor" name="autor" [(ngModel)]="autor">

  <button type="button" (click)="InsertarLibro()">Insertar Libro</button>
</form>
<h1>Mostrar Libros</h1>

@if(libros.length > 0) {
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Autor</th>
        <th>Acciones</th>
       
      </tr>
    </thead>
    <tbody>
      @for (libro of libros; track libro.id) {
        <tr>
          <td>{{libro.id}}</td>
          <td>{{libro.titulo}}</td>
          <td>{{libro.autor}}</td>
          <td>
            <button type="button" (click)="EliminarLibro(libro.id)">Eliminar</button>
            <button type="button" (click)="Apartado_ActualizarLibro(libro.id)">Actualizar</button>
          </td>
        </tr>
      }

    </tbody>
  </table>
} @else {
  <p>No hay libros disponibles.</p>
}

@if(editable) {
  <h1>Actualizar Libro</h1>
  <form>
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" name="tituloActualizar" [(ngModel)]="tituloActualizar" >

    <label for="autor">Autor:</label>
    <input type="text" id="autor" name="autorActualizar" [(ngModel)]="autorActualizar" >

    <button type="button" (click)="ActualizarLibro(id)">Actualizar Libro</button>
  </form>
}

<button type="button" (click)="CerrarSesion()">Cerrar Sesión</button>
